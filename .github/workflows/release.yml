name: Release

# Builds the add-in for every AutoCAD series (R24 2022-2024 / R25 2025-2026 / R26 2027) and
# publishes dist/T3LabCAD.zip, which T3Lab's MCP Control installs on Connect.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build R24 / R25 / R26
        run: |
          for s in R24 R25 R26; do
            for p in T3LabCAD.Core T3LabCAD.Loader; do
              dotnet build "src/$p/$p.csproj" -c Release -nologo -v q -p:AcadSeries=$s
            done
          done
      - name: Fair call queue test (Conductor.cs, no host needed)
        run: dotnet run --project tests/conductor_test -nologo
      - name: Connect AI script test (register_mcp.py, fake home)
        run: python3 -I tests/test_register.py
      - name: Tools snapshot matches the source
        run: python3 -I scripts/gen_tools_snapshot.py --check
      - name: Package
        run: python3 scripts/package.py
      - name: Bridge smoke test (no AutoCAD)
        run: python3 -I tests/smoke_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: T3LabCAD
          path: dist/T3LabCAD.zip
      - name: GitHub Release
        # A merge to main publishes too, so a release needs no extra click; same version = assets replaced.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/T3LabCAD.zip --clobber
          else
            gh release create "$tag" dist/T3LabCAD.zip --target "$GITHUB_SHA" \
              --title "T3LabCAD $version" \
              --notes "AutoCAD / Civil 3D 2022-2027 (R24, R25, R26). Installed by T3Lab MCP Control (Connect), or unzip: T3LabCAD.bundle -> %APPDATA%\\Autodesk\\ApplicationPlugins, T3LabCAD -> %APPDATA%."
          fi
